[package]
name = "vr-verifiable-ai-record"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Deterministic Verifiable AI Record sealing law"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
vertrule-schemas = { version = "0.6", path = ".." }
vr-jcs = { version = "0.4", path = "../../vr-jcs" }
vr-proposal-admission = { path = "../vr-proposal-admission" }
vr-receipt-identity = { path = "../vr-receipt-identity" }

[dev-dependencies]
anyhow = "1"

[lints.rust]
unsafe_code = "deny"
unused_extern_crates = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = { level = "deny", priority = 1 }
expect_used = { level = "deny", priority = 1 }
panic = { level = "deny", priority = 1 }
