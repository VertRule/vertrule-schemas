# This repo is a 3-crate workspace: the root package `vertrule-schemas`
# (shape only), `vr-receipt-identity` (receipt-identity law), and the narrow
# `vr-proposal-admission` transition law.
# Load-bearing invariant: the `vertrule-schemas` crate MUST NOT depend on
# `vr-receipt-identity` (the dependency direction is one-way).
[workspace]
members = ["vr-proposal-admission", "vr-receipt-identity", "vr-verifiable-ai-record"]
resolver = "2"

[package]
name = "vertrule-schemas"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
description = "Canonical schema types for the VertRule constitutional layer"
repository = "https://github.com/VertRule/vertrule-schemas"
keywords = ["receipts", "verification", "schemas", "canonical-json", "deterministic"]
categories = ["encoding", "data-structures"]
exclude = [
    ".claude/**",
    ".github/**",
    ".vr/**",
    "operator_private/**",
    "tooling/**",
    "justfile",
    "PUBLIC_SURFACE.md",
    "RELEASE.md",
    "*.capability.yaml",
    "**/*.capability.yaml",
]

[features]
default = []
governance-check = ["dep:toml"]

[[bin]]
name = "validate-governance-surface"
path = "src/bin/validate_governance_surface.rs"
required-features = ["governance-check"]

[dependencies]
vr-identity = { version = "0.1", path = "../vertrule-runtime/crates/vr-identity" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
toml = { version = "0.8", optional = true }
vr-jcs = { version = "0.4", path = "../vr-jcs" }

[dev-dependencies]
# Test-only: byte-law oracles reproduce digests with the raw primitive,
# deliberately not through the sealed constructor under test.
blake3 = "1"
anyhow = "1"

[lints.rust]
unsafe_code = "deny"
unused_extern_crates = "deny"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
field_reassign_with_default = "warn"
float_arithmetic = "deny"
suboptimal_flops = "deny"
lossy_float_literal = "deny"
cast_precision_loss = "deny"
iter_not_returning_iterator = "deny"
unwrap_used = { level = "deny", priority = 1 }
expect_used = { level = "deny", priority = 1 }
dbg_macro = "deny"
todo = "deny"
use_self = "warn"
map_unwrap_or = "warn"
redundant_closure = "warn"
nonminimal_bool = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
must_use_candidate = "warn"
